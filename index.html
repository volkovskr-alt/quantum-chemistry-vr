<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Chemistry VR Sandbox</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #05050a; font-family: sans-serif; color: #fff; }
        #ui-container { position: absolute; top: 15px; left: 15px; background: rgba(15, 15, 25, 0.9); padding: 20px; border-radius: 12px; border: 1px solid #333d52; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 280px; z-index: 10; }
        h1 { font-size: 16px; margin: 0 0 15px 0; color: #8a9eff; text-transform: uppercase; letter-spacing: 1px; }
        .control-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; }
        select, input[type="range"] { width: 100%; padding: 8px; background: #1a1b26; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; }
        #status { font-size: 11px; color: #00ffcc; margin-top: 10px; font-family: monospace; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1>⚛️ NTO Visualizer</h1>
        <div class="control-group">
            <label for="orbital-selector">Select Orbital Pair</label>
            <select id="orbital-selector"></select>
        </div>
        <div class="control-group">
            <label for="isovalue-slider">Isovalue (Density Threshold)</label>
            <input type="range" id="isovalue-slider" min="0.001" max="0.05" step="0.001" value="0.015">
            <span id="slider-val" style="font-size: 11px; color: #8a9eff;">0.015</span>
        </div>
        <div id="status">Warming up visualizer arrays...</div>
    </div>

    <div id="canvas-container"></div>

    <!-- Полностью локальное считывание библиотек 3D движка -->
    <script src="js/three.min.js"></script>
    <script src="js/OrbitControls.js"></script>
    <script src="js/MarchingCubes.js"></script>

    <script>
        // --- 1. МГНОВЕННОЕ ЗАПОЛНЕНИЕ ВЫПАДАЮЩЕГО СПИСКА ---
        const ORBITAL_FILES = [
            "b1h.cub", "b1e.cub",
            "b2h.cub", "b2e.cub",
            "b3h.cub", "b3e.cub",
            "b4h.cub", "b4e.cub",
            "b5h.cub", "b5e.cub",
            "b6h.cub", "b6e.cub",
            "b7h.cub", "b7e.cub",
            "b8h.cub", "b8e.cub",
            "b9h.cub", "b9e.cub",
            "b10h.cub", "b10e.cub",
            "b11h.cub", "b11e.cub",
            "b12h.cub", "b12e.cub"
        ];

        const selector = document.getElementById('orbital-selector');
        ORBITAL_FILES.forEach(file => {
            const opt = document.createElement('option');
            opt.value = file;
            opt.textContent = file.replace('.cub', '').toUpperCase();
            selector.appendChild(opt);
        });

        const statusEl = document.getElementById('status');
        statusEl.textContent = "Autonomous engine active. Anchoring visual grid...";

        // --- 2. ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ХОЛСТА ---
        let scene, camera, renderer, controls;
        let posMaterial, negMaterial, marchingCubesController;
        let currentVolumetricData = null;
        let activeResolution = 45; 
        let atomMeshGroup = new THREE.Group();

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x05050a);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(45, 45, 85);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);
                        controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambientLight = new THREE.AmbientLight(0x555555);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight1.position.set(1, 1, 1).normalize();
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0x7788ff, 0.4);
            dirLight2.position.set(-1, -1, -1).normalize();
            scene.add(dirLight2);

            posMaterial = new THREE.MeshPhongMaterial({ color: 0xff4444, transparent: true, opacity: 0.65, side: THREE.DoubleSide, shininess: 40 });
            negMaterial = new THREE.MeshPhongMaterial({ color: 0x4444ff, transparent: true, opacity: 0.65, side: THREE.DoubleSide, shininess: 40 });

            scene.add(atomMeshGroup);

            selector.addEventListener('change', (e) => fetchAndParseCube(e.target.value));
            
            document.getElementById('isovalue-slider').addEventListener('input', (e) => {
                document.getElementById('slider-val').textContent = parseFloat(e.target.value).toFixed(3);
                updateIsosurface();
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
            
            setTimeout(() => {
                fetchAndParseCube(ORBITAL_FILES); 
            }, 300);
        }

        // --- 3. ADAPTIVE GRID STRUCTURE AUTO-SCAN PARSER ---
        async function fetchAndParseCube(fileName) {
            statusEl.textContent = `Fetching local ${fileName.toUpperCase()}...`;
            statusEl.style.color = '#00ffcc';
            
            const targetUrl = `data/${fileName}`;
            
            try {
                const response = await fetch(targetUrl);
                if (!response.ok) throw new Error("Local dataset stream read failure.");
                const rawText = await response.text();
                
                statusEl.textContent = "Translating calculation coefficients...";
                
                const cleanText = rawText.replace(/D([+-])/gi, 'E\$1');
                const tokens = cleanText.trim().split(/\s+/);
                
                while(atomMeshGroup.children.length > 0){
                    atomMeshGroup.remove(atomMeshGroup.children);
                }

                // --- 4. INDEPENDENT SPECTRUM AUTO-SCAN ENGINE ---
                let scanPtr = 0;
                let atomCountRaw = NaN;
                while (scanPtr < tokens.length) {
                    let val = parseInt(tokens[scanPtr]);
                    if (!isNaN(val) && tokens[scanPtr].indexOf('.') === -1 && tokens[scanPtr] !== "0") {
                        atomCountRaw = val;
                        break;
                    }
                    scanPtr++;
                }

                if (isNaN(atomCountRaw)) throw new Error("Could not parse dataset structural headers.");
                let numAtoms = Math.abs(atomCountRaw);

                scanPtr++;
                let dimensions = [];
                while (scanPtr < tokens.length && dimensions.length < 3) {
                    let possibleDimToken = tokens[scanPtr];
                    let intCheck = parseInt(possibleDimToken);
                    
                    if (!isNaN(intCheck) && possibleDimToken.indexOf('.') === -1 && intCheck > 0) {
                        dimensions.push(intCheck);
                        scanPtr += 4; 
                        continue;
                    }
                    scanPtr++;
                }

                if (dimensions.length < 3) throw new Error("Invalid or cropped grid dimension paths mapping.");
                
                const countX = dimensions[0];
                const countY = dimensions[1];
                const countZ = dimensions[2];

                // --- 5. SYNCHRONIZED ATOMIC GEOMETRY LOADER ---
                let atomsProcessed = 0;
                while (scanPtr < tokens.length && atomsProcessed < numAtoms) {
                    let currentTokenInt = parseInt(tokens[scanPtr]);
                    
                    if (currentTokenInt === 27 || currentIntToken === 17 || tokens[scanPtr] === "27" || tokens[scanPtr] === "17") {
                        let detectedElement = parseInt(tokens[scanPtr]);
                        atomsProcessed++;
                        scanPtr += 2; 
                        
                        let posX = parseFloat(tokens[scanPtr++]) * 6.0;
                        let posY = parseFloat(tokens[scanPtr++]) * 6.0;
                        let posZ = parseFloat(tokens[scanPtr++]) * 6.0;

                        let elementColor = 0xccd7e6; 
                        let atomRadius = 0.8;

                        if (detectedElement === 27) {
                            elementColor = 0x8a2be2; 
                            atomRadius = 1.4;
                        } else if (detectedElement === 17) {
                            elementColor = 0x32cd32; 
                            atomRadius = 1.0;
                        }

                        let geom = new THREE.SphereGeometry(atomRadius, 32, 32);
                        let mat = new THREE.MeshPhongMaterial({ color: elementColor, shininess: 80, specular: 0x444444 });
                        let mesh = new THREE.Mesh(geom, mat);
                        
                        mesh.position.set(posX, posY, posZ);
                        atomMeshGroup.add(mesh);
                        continue;
                    }
                    scanPtr++;
                }
                                // Step past the trailing records indicator labels (e.g. 1 59 or 1 1) securely
                while (scanPtr < tokens.length) {
                    let valStr = tokens[scanPtr];
                    if (valStr.indexOf('.') !== -1) {
                        let parsedTest = parseFloat(valStr);
                        // True electron densities start when encountering values bounded smaller than 1.0
                        if (!isNaN(parsedTest) && Math.abs(parsedTest) < 1.0 && parsedTest !== 0) {
                            break; 
                        }
                    }
                    scanPtr++;
                }

                // --- 6. FIELD COEFFICIENTS DATA EXTRACTION ---
                let volumetricValuesGrid = [];
                for (let k = scanPtr; k < tokens.length; k++) {
                    let densityValue = parseFloat(tokens[k]);
                    if (!isNaN(densityValue)) {
                        volumetricValuesGrid.push(densityValue);
                    }
                }
                
                currentVolumetricData = {
                    nx: countX, ny: countY, nz: countZ,
                    data: volumetricValuesGrid
                };
                
                statusEl.textContent = "Recalculating sub-volume window...";
                updateIsosurface();
                statusEl.textContent = "Orbital Render Complete!";
                statusEl.style.color = '#00ff66';
                
            } catch (err) {
                statusEl.textContent = `Error processing cube matrix.`;
                statusEl.style.color = '#ff4444';
                console.error(err);
            }
        }

        // --- 7. HIGH-PERFORMANCE WINDOWED MARCHING CUBES LAYER ---
        function updateIsosurface() {
            if (!currentVolumetricData || !scene) return;
            
            if (marchingCubesController) scene.remove(marchingCubesController);
            
            const isovalue = parseFloat(document.getElementById('isovalue-slider').value);
            const res = activeResolution; // High definition 45 layout concentrated inside reaction coordinates
            
            marchingCubesController = new THREE.MarchingCubes(res, posMaterial, true, true, 100000);
            marchingCubesController.position.set(0, 0, 0);
            marchingCubesController.scale.set(45, 45, 45); 
            
            marchingCubesController.init(res);
            
            const data = currentVolumetricData.data;
            const nx = Math.abs(currentVolumetricData.nx); 
            const ny = Math.abs(currentVolumetricData.ny); 
            const nz = Math.abs(currentVolumetricData.nz); 
            
            // Sub-Volume focus mapping: restrict math evaluations strictly to the coordinate zone (35% to 65%)
            for (let x = 1; x < res - 1; x++) {
                for (let y = 1; y < res - 1; y++) {
                    for (let z = 1; z < res - 1; z++) {
                        
                        let normX = 0.35 + (x / res) * 0.30;
                        let normY = 0.35 + (y / res) * 0.30;
                        let normZ = 0.35 + (z / res) * 0.30;

                        let dataX = Math.floor(normX * nx);
                        let dataY = Math.floor(normY * ny);
                        let dataZ = Math.floor(normZ * nz);
                        
                        let index = dataX * (ny * nz) + dataY * nz + dataZ;
                        
                        if (index >= 0 && index < data.length) {
                            let val = data[index] || 0;
                            marchingCubesController.setValue(x, y, z, val);
                        }
                    }
                }
            }
            
            marchingCubesController.isolation = isovalue;
            scene.add(marchingCubesController);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls && renderer && camera && scene) {
                controls.update();
                renderer.render(scene, camera);
            }
        }
        
        init3D();
    </script>
</body>
</html>
