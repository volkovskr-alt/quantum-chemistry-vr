<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Chemistry VR Sandbox</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #05050a; font-family: sans-serif; color: #fff; }
        #ui-container { position: absolute; top: 15px; left: 15px; background: rgba(15, 15, 25, 0.9); padding: 20px; border-radius: 12px; border: 1px solid #333d52; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 280px; z-index: 10; }
        h1 { font-size: 16px; margin: 0 0 15px 0; color: #8a9eff; text-transform: uppercase; letter-spacing: 1px; }
        .control-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; }
        select, input[type="range"] { width: 100%; padding: 8px; background: #1a1b26; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; }
        #status { font-size: 11px; color: #00ffcc; margin-top: 10px; font-family: monospace; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1>⚛️ NTO Visualizer</h1>
        <div class="control-group">
            <label for="orbital-selector">Select Orbital Pair</label>
            <select id="orbital-selector"></select>
        </div>
        <div class="control-group">
            <label for="isovalue-slider">Isovalue (Density Threshold)</label>
            <input type="range" id="isovalue-slider" min="0.001" max="0.1" step="0.001" value="0.02">
            <span id="slider-val" style="font-size: 11px; color: #8a9eff;">0.020</span>
        </div>
        <div id="status">Ready to initialize...</div>
    </div>

    <div id="canvas-container"></div>

    <!-- Load Three.js 3D Engine Foundations -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>

    <script>
        // --- 1. CONFIGURATION & DATA REPOSITORY SETUP ---
        // Array mapping out your exact calculated .cube filenames
        const ORBITAL_FILES = [
            "b1h.cub", "b1e.cub",
            "b2h.cub", "b2e.cub",
            "b3h.cub", "b3e.cub",
            "b4h.cub", "b4e.cub",
            "b5h.cub", "b5e.cub",
            "b6h.cub", "b6e.cub",
            "b7h.cub", "b7e.cub",
            "b8h.cub", "b8e.cub",
            "b9h.cub", "b9e.cub",
            "b10h.cub", "b10e.cub",
            "b11h.cub", "b11e.cub",
            "b12h.cub", "b12e.cub"
        ];

        // --- 2. INITIALIZE THREE.JS 3D VIEWPORT CANVAS ---
        const container = document.getElementById('canvas-container');
        const statusEl = document.getElementById('status');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05050a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(30, 30, 50);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Add balanced lighting setup to highlight orbital spatial contours
        const ambientLight = new THREE.AmbientLight(0x555555);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight1.position.set(1, 1, 1).normalize();
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0x7788ff, 0.4);
        dirLight2.position.set(-1, -1, -1).normalize();
        scene.add(dirLight2);

        // --- 3. MATERIALS SETUP FOR CONTUOR LOBES ---
        // Positive Wave Lobe: Glossy semi-translucent red mesh
        const posMaterial = new THREE.MeshPhongMaterial({ color: 0xff4444, transparent: true, opacity: 0.75, side: THREE.DoubleSide, shininess: 40 });
        // Negative Wave Lobe: Glossy semi-translucent blue mesh
        const negMaterial = new THREE.MeshPhongMaterial({ color: 0x4444ff, transparent: true, opacity: 0.75, side: THREE.DoubleSide, shininess: 40 });

        // Place a visual placeholder object indicating the central Metal core position
        const coreGeo = new THREE.SphereGeometry(1.2, 32, 32);
        const coreMat = new THREE.MeshPhongMaterial({ color: 0xccd7e6, shininess: 80 });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        scene.add(coreMesh);

        // Generate target layout entries inside interface selection bar dropdown
        const selector = document.getElementById('orbital-selector');
        ORBITAL_FILES.forEach(file => {
            const opt = document.createElement('option');
            opt.value = file;
            opt.textContent = file.replace('.cube', '').toUpperCase();
            selector.appendChild(opt);
        });
        // --- 4. NETWORK FETCH PIPE & MATRIX GRID PARSER ---
        let currentVolumetricData = null;
        let activeResolution = 40; // Spatial resolution step grid count
        let marchingCubesController = null;

        async function fetchAndParseCube(fileName) {
            statusEl.textContent = `Fetching file from Dropbox...`;
            statusEl.style.color = '#00ffcc';
            
            // Constructs direct download streaming URL pipeline pointing to your shared folder files
            const targetUrl = `https://dropboxusercontent.com{fileName}?rlkey=hdcbhsqucji45kb6cuat0y049&dl=1`;
            
            try {
                const response = await fetch(targetUrl);
                if (!response.ok) throw new Error("HTTP Network error fetching file.");
                const text = await response.text();
                
                statusEl.textContent = "Parsing cube density fields...";
                const lines = text.split('\n');
                
                // Parse structural headers geometry data matrix parameters
                const atomCount = parseInt(lines[2].trim().split(/\s+/)[0]);
                const countX = parseInt(lines[3].trim().split(/\s+/)[0]);
                const countY = parseInt(lines[4].trim().split(/\s+/)[0]);
                const countZ = parseInt(lines[5].trim().split(/\s+/)[0]);
                
                let dataStartLine = 6 + Math.abs(atomCount);
                let values = [];
                
                // Read remaining text string records into numerical float numbers array map
                for (let i = dataStartLine; i < lines.length; i++) {
                    let lineVals = lines[i].trim().split(/\s+/);
                    for (let j = 0; j < lineVals.length; j++) {
                        if (lineVals[j] !== "") {
                            values.push(parseFloat(lineVals[j]));
                        }
                    }
                }
                
                currentVolumetricData = {
                    nx: Math.abs(countX), ny: Math.abs(countY), nz: Math.abs(countZ),
                    data: values
                };
                
                statusEl.textContent = "Recalculating Isosurfaces...";
                updateIsosurface();
                statusEl.textContent = "Orbital Render Complete!";
                statusEl.style.color = '#00ff66';
                
            } catch (err) {
                statusEl.textContent = `Error loading data file.`;
                statusEl.style.color = '#ff4444';
                console.error(err);
            }
        }

        // --- 5. SURFACE ISOCONTOUR GENERATOR ---
        function updateIsosurface() {
            if (!currentVolumetricData) return;
            
            if (marchingCubesController) scene.remove(marchingCubesController);
            
            const isovalue = parseFloat(document.getElementById('isovalue-slider').value);
            const res = activeResolution;
            
            // Initialize rendering structure engine matrix object bound fields sizes
            marchingCubesController = new THREE.MarchingCubes(res, posMaterial, true, true, 100000);
            marchingCubesController.position.set(0, 0, 0);
            marchingCubesController.scale.set(16, 16, 16); 
            
            marchingCubesController.init(res);
            
            const data = currentVolumetricData.data;
            const nx = currentVolumetricData.nx;
            const ny = currentVolumetricData.ny;
            const nz = currentVolumetricData.nz;
            
            // Map spatial coordinates values bounds indexes into standard Marching Cubes grid layout
            for (let x = 0; x < res; x++) {
                for (let y = 0; y < res; y++) {
                    for (let z = 0; z < res; z++) {
                        let dataX = Math.floor((x / res) * nx);
                        let dataY = Math.floor((y / res) * ny);
                        let dataZ = Math.floor((z / res) * nz);
                        let index = dataX * (ny * nz) + dataY * nz + dataZ;
                        
                        let val = data[index] || 0;
                        marchingCubesController.setValue(x, y, z, val);
                    }
                }
            }
            
            marchingCubesController.isolation = isovalue;
            scene.add(marchingCubesController);
        }

        // --- 6. EVENT INTERFACE CONTROLS & LOOP TRIGGERS ---
        selector.addEventListener('change', (e) => fetchAndParseCube(e.target.value));
        
        const slider = document.getElementById('isovalue-slider');
        slider.addEventListener('input', (e) => {
            document.getElementById('slider-val').textContent = parseFloat(e.target.value).toFixed(3);
            updateIsosurface();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        // Execute initial runtime execution stream reading item #1 from registry stack array list
        fetchAndParseCube(ORBITAL_FILES[0]);
        animate();
    </script>
</body>
</html>
