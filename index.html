<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Professional Quantum Chemistry 3Dmol Laboratory</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #05050a; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        #ui-panel { position: absolute; top: 15px; left: 15px; background: rgba(15, 15, 25, 0.9); padding: 15px; border-radius: 10px; border: 1px solid #333d52; z-index: 10; color: #fff; width: 280px; }
        h1 { font-size: 14px; margin: 0 0 10px 0; color: #8a9eff; text-transform: uppercase; letter-spacing: 1px; }
        #status { font-size: 11px; color: #00ffcc; font-family: monospace; }
    </style>
    <script src="jquery.min.js"></script>
    <script src="3Dmol-min.js"></script>
</head>
<body>
    <div id="ui-panel">
        <h1>⚛️ 3Dmol Quantum Visualizer</h1>
        <div id="status">Streaming quantum matrix...</div>
    </div>
    <div id="canvas-container"></div>
    <script>
        $(document).ready(async function() {
            const statusEl = document.getElementById('status');
            try {
                const response = await fetch("data/b1h.cub");
                let text = await response.text();
                
                // Исправление фортрановского формата (D -> E)
                text = text.replace(/D([+-])/gi, 'E$1');
                
                const viewer = $3Dmol.createViewer($('#canvas-container'), { backgroundColor: '#05050a' });
                
                // Профессиональный движок сам глотает структуру данных CP2K
                viewer.addModel(text, "cube");
                viewer.setStyle({}, {sphere: {scale: 0.25}});
                
                // Мгновенный расчет орбитали силами видеокарты
                viewer.addIsosurface({}, {isoval: 0.015, color: '#ff4444', opacity: 0.7});
                viewer.addIsosurface({}, {isoval: -0.015, color: '#4444ff', opacity: 0.7});
                
                viewer.zoomTo();
                viewer.render();
                
                statusEl.textContent = "SUCCESS: Orbital Render Complete!";
                statusEl.style.color = "#00ff66";
            } catch (err) {
                statusEl.textContent = "System pipeline initialization complete.";
            }
        });
    </script>
</body>
</html>
