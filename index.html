<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Professional Quantum Chemistry 3Dmol Laboratory</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #05050a; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        #ui-panel { position: absolute; top: 15px; left: 15px; background: rgba(15, 15, 25, 0.9); padding: 15px; border-radius: 10px; border: 1px solid #333d52; z-index: 10; color: #fff; width: 250px; }
        h1 { font-size: 14px; margin: 0 0 10px 0; color: #8a9eff; text-transform: uppercase; letter-spacing: 1px; }
        #status { font-size: 11px; color: #00ffcc; font-family: monospace; }
    </style>
    <!-- Подключение официального профессионального молекулярного ядра 3Dmol.js -->
    <script src="https://3dmol.org"></script>
    <script src="https://jquery.com"></script>
</head>
<body>

    <div id="ui-panel">
        <h1>⚛️ 3Dmol Engine Active</h1>
        <div id="status">Streaming quantum matrix...</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        $(document).ready(async function() {
            const statusEl = document.getElementById('status');
            
            // Наш целевой файл, который мы выстрадали и настроили на GitHub
            const cubeUrl = "data/b1h.cub";
            
            try {
                // 1. Создаем профессиональный WebGL-холст со сглаживанием внутри контейнера
                const element = $('#canvas-container');
                const config = { backgroundColor: '#05050a' };
                const viewer = $3Dmol.createViewer(element, config);
                
                statusEl.textContent = "Fetching local Cube stream...";
                
                // 2. Скачиваем файл по сети через асинхронный буфер
                const response = await fetch(cubeUrl);
                if(!response.ok) throw new Error("Network dataset read failure.");
                const cubeDataText = await response.text();
                
                statusEl.textContent = "Rendering hardware Isosurfaces...";
                
                // 3. Скармливаем весь куб целиком в 3Dmol — он сам нарисует и атомы, и орбитали!
                viewer.addModel(cubeDataText, "cube");
                
                // Настройка отображения атомов: классические сферы CPK
                viewer.setStyle({}, {sphere: {scale: 0.3}});
                
                // Настройка волновой функции: мгновенный расчет положительной и отрицательной фаз d-орбитали!
                // Порог изоповерхности жестко зафиксирован на вашем идеальном физическом уровне 0.015
                viewer.addIsosurface({}, {isoval: 0.015, color: 'red', opacity: 0.65});
                viewer.addIsosurface({}, {isoval: -0.015, color: 'blue', opacity: 0.65});
                
                // Автоматически центрируем камеру и масштабируем сцену под размеры октаэдра
                viewer.zoomTo();
                viewer.render();
                
                statusEl.textContent = "Orbital Render Complete!";
                statusEl.style.color = "#00ff66";
                
            } catch (err) {
                statusEl.textContent = "Error rendering 3Dmol canvas.";
                statusEl.style.color = "#ff4444";
                console.error(err);
            }
        });
    </script>
</body>
</html>
