<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Chemistry VR Sandbox</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #05050a; font-family: sans-serif; color: #fff; }
        #ui-container { position: absolute; top: 15px; left: 15px; background: rgba(15, 15, 25, 0.9); padding: 20px; border-radius: 12px; border: 1px solid #333d52; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 280px; z-index: 10; }
        h1 { font-size: 16px; margin: 0 0 15px 0; color: #8a9eff; text-transform: uppercase; letter-spacing: 1px; }
        .control-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; }
        select, input[type="range"] { width: 100%; padding: 8px; background: #1a1b26; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; }
        #status { font-size: 11px; color: #00ffcc; margin-top: 10px; font-family: monospace; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1>⚛️ NTO Visualizer</h1>
        <div class="control-group">
            <label for="orbital-selector">Select Orbital Pair</label>
            <select id="orbital-selector"></select>
        </div>
        <div class="control-group">
            <label for="isovalue-slider">Isovalue (Density Threshold)</label>
            <input type="range" id="isovalue-slider" min="0.001" max="0.1" step="0.001" value="0.02">
            <span id="slider-val" style="font-size: 11px; color: #8a9eff;">0.020</span>
        </div>
        <div id="status">Initializing autonomous engine...</div>
    </div>

    <div id="canvas-container"></div>

    <!-- Чтение библиотек движка строго локально из вашего репозитория -->
    <script src="js/three.min.js"></script>
    <script src="js/OrbitControls.js"></script>
    <script src="js/MarchingCubes.js"></script>

    <script>
        // --- 1. ЗАПОЛНЕНИЕ ВЫПАДАЮЩЕГО СПИСКА ОРБИТАЛЕЙ ---
        const ORBITAL_FILES = [
            "b1h.cub", "b1e.cub",
            "b2h.cub", "b2e.cub",
            "b3h.cub", "b3e.cub",
            "b4h.cub", "b4e.cub",
            "b5h.cub", "b5e.cub",
            "b6h.cub", "b6e.cub",
            "b7h.cub", "b7e.cub",
            "b8h.cub", "b8e.cub",
            "b9h.cub", "b9e.cub",
            "b10h.cub", "b10e.cub",
            "b11h.cub", "b11e.cub",
            "b12h.cub", "b12e.cub"
        ];

        const selector = document.getElementById('orbital-selector');
        ORBITAL_FILES.forEach(file => {
            const opt = document.createElement('option');
            opt.value = file;
            opt.textContent = file.replace('.cub', '').toUpperCase();
            selector.appendChild(opt);
        });

        const statusEl = document.getElementById('status');
        statusEl.textContent = "Autonomous core active. Loading data stream...";

        // --- 2. ИНИЦИАЛИЗАЦИЯ 3D СЦЕНЫ ---
        let scene, camera, renderer, controls;
        let posMaterial, negMaterial, marchingCubesController;
        let currentVolumetricData = null;
        let activeResolution = 40;

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x05050a);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(30, 30, 50);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);
                        controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambientLight = new THREE.AmbientLight(0x555555);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight1.position.set(1, 1, 1).normalize();
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0x7788ff, 0.4);
            dirLight2.position.set(-1, -1, -1).normalize();
            scene.add(dirLight2);

            posMaterial = new THREE.MeshPhongMaterial({ color: 0xff4444, transparent: true, opacity: 0.75, side: THREE.DoubleSide, shininess: 40 });
            negMaterial = new THREE.MeshPhongMaterial({ color: 0x4444ff, transparent: true, opacity: 0.75, side: THREE.DoubleSide, shininess: 40 });

            const coreGeo = new THREE.SphereGeometry(1.2, 32, 32);
            const coreMat = new THREE.MeshPhongMaterial({ color: 0xccd7e6, shininess: 80 });
            const coreMesh = new THREE.Mesh(coreGeo, coreMat);
            scene.add(coreMesh);

            selector.addEventListener('change', (e) => fetchAndParseCube(e.target.value));
            
            document.getElementById('isovalue-slider').addEventListener('input', (e) => {
                document.getElementById('slider-val').textContent = parseFloat(e.target.value).toFixed(3);
                updateIsosurface();
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
            fetchAndParseCube(ORBITAL_FILES[0]);
        }

        // --- 3. DROPBOX DATA FETCH PIPE & EXTRA-RESILIENT CUBE PARSER ---
        async function fetchAndParseCube(fileName) {
            statusEl.textContent = `Fetching ${fileName.toUpperCase()}...`;
            statusEl.style.color = '#00ffcc';
            
            const targetUrl = `https://dropboxusercontent.com{fileName}?rlkey=hdcbhsqucji45kb6cuat0y049&dl=1`;
            
            try {
                const response = await fetch(targetUrl);
                if (!response.ok) throw new Error("Data fetch pipe failed.");
                const text = await response.text();
                
                statusEl.textContent = "Parsing cube data matrix...";
                // Split lines, trimming spaces cleanly from every single string row
                const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                
                if (lines.length < 6) throw new Error("File formatting too short.");

                // Read structural dimensions from fixed Gaussian header index arrays
                const atomCount = parseInt(lines[2].split(/\s+/)[0]);
                const countX = parseInt(lines[3].split(/\s+/)[0]);
                const countY = parseInt(lines[4].split(/\s+/)[0]);
                const countZ = parseInt(lines[5].split(/\s+/)[0]);
                
                // Calculate data section row entry point skipping comment logs and grids arrays
                let dataStartLine = 6 + Math.abs(atomCount);
                let values = [];
                
                for (let i = dataStartLine; i < lines.length; i++) {
                    let lineVals = lines[i].split(/\s+/);
                    for (let j = 0; j < lineVals.length; j++) {
                        if (lineVals[j] !== "") {
                            let parsedFloat = parseFloat(lineVals[j]);
                            if (!isNaN(parsedFloat)) {
                                values.push(parsedFloat);
                            }
                        }
                    }
                }
                
                currentVolumetricData = {
                    nx: Math.abs(countX), ny: Math.abs(countY), nz: Math.abs(countZ),
                    data: values
                };
                
                statusEl.textContent = "Recalculating Isosurfaces...";
                updateIsosurface();
                statusEl.textContent = "Orbital Render Complete!";
                statusEl.style.color = '#00ff66';
                
            } catch (err) {
                statusEl.textContent = `Error processing cube matrix.`;
                statusEl.style.color = '#ff4444';
                console.error(err);
            }
        }

        // --- 4. SURFACE CONTOUR CALCULATOR (MARCHING CUBES) ---
        function updateIsosurface() {
            if (!currentVolumetricData || !scene) return;
            
            if (marchingCubesController) scene.remove(marchingCubesController);
            
            const isovalue = parseFloat(document.getElementById('isovalue-slider').value);
            const res = activeResolution;
            
            marchingCubesController = new THREE.MarchingCubes(res, posMaterial, true, true, 100000);
            marchingCubesController.position.set(0, 0, 0);
            marchingCubesController.scale.set(16, 16, 16); 
            
            marchingCubesController.init(res);
            
            const data = currentVolumetricData.data;
            const nx = currentVolumetricData.nx;
            const ny = currentVolumetricData.ny;
            const nz = currentVolumetricData.nz;
            
            for (let x = 0; x < res; x++) {
                for (let y = 0; y < res; y++) {
                    for (let z = 0; z < res; z++) {
                        let dataX = Math.floor((x / res) * nx);
                        let dataY = Math.floor((y / res) * ny);
                        let dataZ = Math.floor((z / res) * nz);
                        let index = dataX * (ny * nz) + dataY * nz + dataZ;
                        
                        let val = data[index] || 0;
                        marchingCubesController.setValue(x, y, z, val);
                    }
                }
            }
            
            marchingCubesController.isolation = isovalue;
            scene.add(marchingCubesController);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls && renderer && camera && scene) {
                controls.update();
                renderer.render(scene, camera);
            }
        }
        
        init3D();
    </script>
</body>
</html>
