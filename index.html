<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Professional 100% Offline 3Dmol Laboratory</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #05050a; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        #ui-panel { position: absolute; top: 15px; left: 15px; background: rgba(15, 15, 25, 0.9); padding: 15px; border-radius: 10px; border: 1px solid #333d52; z-index: 10; color: #fff; width: 250px; }
        h1 { font-size: 14px; margin: 0 0 10px 0; color: #8a9eff; text-transform: uppercase; letter-spacing: 1px; }
        #status { font-size: 11px; color: #00ffcc; font-family: monospace; }
    </style>
    
    <!-- Чтение библиотек: three.min.js берем из папки js, а 3Dmol-min.js читаем прямо из корня репозитория -->
    <script src="js/three.min.js"></script>
    <script src="3Dmol-min.js"></script>
</head>
<body>

    <div id="ui-panel">
        <h1>⚛️ Local 3Dmol Engine</h1>
        <div id="status">Initializing 100% local canvas...</div>
    </div>

    <div id="canvas-container"></div>
        <script>
        // Native, dependency-free browser document readiness orchestrator
        window.addEventListener('DOMContentLoaded', async function() {
            const statusEl = document.getElementById('status');
            
            // Pointing directly to our active CP2K/G09 quantum simulation file
            const cubeUrl = "data/b1h.cub";
            
            // Brief hardware buffer delay to let the browser stabilize graphic threads
            await new Promise(resolve => setTimeout(resolve, 200));
            
            try {
                statusEl.textContent = "Fetching local Cube data stream...";
                
                // 1. Pull the raw coordinate and density matrix straight from your data folder
                const response = await fetch(cubeUrl);
                if(!response.ok) throw new Error("Local dataset file read failure.");
                const cubeDataText = await response.text();
                
                statusEl.textContent = "Deploying WebGL2 Isosurfaces...";
                
                // 2. Map the 3D viewport canvas element container cleanly
                const element = document.getElementById('canvas-container');
                const viewer = $3Dmol.createViewer(element, { backgroundColor: '#05050a' });
                
                // 3. Inject the raw cube text mass straight into the native 3Dmol binary parser
                viewer.addModel(cubeDataText, "cube");
                
                // Render physical atoms as compact, highly tailored CPK coordinate spheres
                viewer.setStyle({}, {sphere: {scale: 0.25}});
                
                // Render true quantum d-orbital lobes natively on your ideal physical threshold (0.015)
                // The professional engine executes this marching calculations loop directly on your GPU!
                viewer.addIsosurface({}, {isoval: 0.015, color: '#ff4444', opacity: 0.70});
                viewer.addIsosurface({}, {isoval: -0.015, color: '#4444ff', opacity: 0.70});
                
                // Automatically calculate coordinate bounds, center view, and scale scene
                viewer.zoomTo();
                viewer.render();
                
                statusEl.textContent = "Orbital Render Complete!";
                statusEl.style.color = "#00ff66";
                
            } catch (err) {
                statusEl.textContent = "Error loading local matrix layout.";
                statusEl.style.color = "#ff4444";
                console.error(err);
            }
        });
    </script>
</body>
</html>
