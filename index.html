<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Professional 100% Flat 3Dmol Laboratory</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #05050a; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        #ui-panel { position: absolute; top: 15px; left: 15px; background: rgba(15, 15, 25, 0.9); padding: 15px; border-radius: 10px; border: 1px solid #333d52; z-index: 10; color: #fff; width: 320px; }
        h1 { font-size: 14px; margin: 0 0 10px 0; color: #8a9eff; text-transform: uppercase; letter-spacing: 1px; }
        #status { font-size: 11px; color: #00ffcc; font-family: monospace; white-space: pre-wrap; word-break: break-all; }
    </style>
    
    <!-- Чтение стабильных движков напрямую из корня вашего репозитория -->
    <script src="jquery.min.js"></script>
    <script src="3Dmol-min.js"></script>
</head>
<body>

    <div id="ui-panel">
        <h1>⚛️ 3Dmol Flat Engine</h1>
        <div id="status">Initializing autonomous core...</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        \$(document).ready(async function() {
            const statusEl = document.getElementById('status');
            const cubeUrl = "data/b1h.cub";
            
            try {
                statusEl.textContent = "Step 1: Fetching local Cube file stream...";
                const response = await fetch(cubeUrl);
                if(!response.ok) throw new Error("HTTP Network Error: Could not fetch 'data/b1h.cub'. Status: " + response.status);
                
                const rawText = await response.text();
                statusEl.textContent = "Step 2: Normalizing CP2K grid dimensions...";
                
                // --- УМНАЯ СТРУКТУРНАЯ НОРМАЛИЗАЦИЯ ПОД СТАНДАРТ 3DMOL ---
                // 1. Переводим фортрановские буквы D в E
                let processedText = rawText.replace(/D([+-])/gi, 'E\$1');
                
                // 2. Разбиваем текст на строки, чтобы вычистить несовместимые маркеры CP2K
                let lines = processedText.split(/\r?\n/);
                
                // Нормализуем строку 3: убираем знак минус у количества атомов (-7 превращаем в 7)
                let row3Tokens = lines[2].trim().split(/\s+/);
                if (row3Tokens.length >= 4) {
                    let numAtoms = Math.abs(parseInt(row3Tokens[0]));
                    lines[2] = `   ${numAtoms}   ${row3Tokens[1]}   ${row3Tokens[2]}   ${row3Tokens[3]}`;
                }
                
                // Нормализуем строки осей 4, 5, 6: оставляем только размер сетки и чистый шаг по диагонали,
                // полностью стирая лишние CP2K-флоаты ориентации, которые ломали свойство e.size!
                for (let r = 3; r <= 5; r++) {
                    let tokens = lines[r].trim().split(/\s+/);
                    if (tokens.length >= 4) {
                        let gridSize = Math.abs(parseInt(tokens[0]));
                        let stepX = (r === 3) ? tokens[1] : "0.000000";
                        let stepY = (r === 4) ? tokens[2] : "0.000000";
                        let stepZ = (r === 5) ? tokens[3] : "0.000000";
                        lines[r] = `   ${gridSize}   ${stepX}   ${stepY}   ${stepZ}`;
                    }
                }
                
                // Собираем очищенный эталонный текст Gaussian обратно в единый массив
                const standardizedCubeText = lines.join("\n");
                
                statusEl.textContent = "Step 3: Deploying WebGL2 Isosurfaces...";
                
                const element = \$('#canvas-container');
                const viewer = \$3Dmol.createViewer(element, { backgroundColor: '#05050a' });
                
                // Передаем стандартизированный куб чисел прямо в движок
                viewer.addModel(standardizedCubeText, "cube");
                
                // Отрисовка геометрии атомов
                viewer.setStyle({}, {sphere: {scale: 0.25}});
                
                // Моментальный вывод волновых фаз d-орбитали силами видеокарты (GPU)
                viewer.addIsosurface({}, {isoval: 0.015, color: '#ff4444', opacity: 0.70});
                viewer.addIsosurface({}, {isoval: -0.015, color: '#4444ff', opacity: 0.70});
                
                viewer.zoomTo();
                viewer.render();
                
                statusEl.textContent = "SUCCESS: Orbital Render Complete!";
                statusEl.style.color = "#00ff66";
                
            } catch (err) {
                statusEl.innerHTML = "<span style='color:#ff4444; font-weight:bold;'>CRASH DETECTED:</span><br><br>" + 
                                     "<b>Message:</b> " + err.message + "<br><br>" +
                                     "<b>Details:</b> <span style='color:#aaa; font-size:10px;'>" + err.stack + "</span>";
                console.error(err);
            }
        });
    </script>
</body>
</html>
