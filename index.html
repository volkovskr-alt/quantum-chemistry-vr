<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Chemistry VR Sandbox</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #05050a; font-family: sans-serif; color: #fff; }
        #ui-container { position: absolute; top: 15px; left: 15px; background: rgba(15, 15, 25, 0.9); padding: 20px; border-radius: 12px; border: 1px solid #333d52; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 280px; z-index: 10; }
        h1 { font-size: 16px; margin: 0 0 15px 0; color: #8a9eff; text-transform: uppercase; letter-spacing: 1px; }
        .control-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; }
        select, input[type="range"] { width: 100%; padding: 8px; background: #1a1b26; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; }
        #status { font-size: 11px; color: #00ffcc; margin-top: 10px; font-family: monospace; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1>⚛️ NTO Visualizer</h1>
        <div class="control-group">
            <label for="orbital-selector">Select Orbital Pair</label>
            <select id="orbital-selector"></select>
        </div>
        <div class="control-group">
            <label for="isovalue-slider">Isovalue (Density Threshold)</label>
            <input type="range" id="isovalue-slider" min="0.001" max="0.1" step="0.001" value="0.02">
            <span id="slider-val" style="font-size: 11px; color: #8a9eff;">0.020</span>
        </div>
        <div id="status">Initializing autonomous engine...</div>
    </div>

    <div id="canvas-container"></div>

    <!-- Локальные модули движка из вашего репозитория -->
    <script src="js/three.min.js"></script>
    <script src="js/OrbitControls.js"></script>
    <script src="js/MarchingCubes.js"></script>

    <script>
        // --- 1. МГНОВЕННОЕ ЗАПОЛНЕНИЕ ВЫПАДАЮЩЕГО СПИСКА ---
        const ORBITAL_FILES = [
            "b1h.cub", "b1e.cub",
            "b2h.cub", "b2e.cub",
            "b3h.cub", "b3e.cub",
            "b4h.cub", "b4e.cub",
            "b5h.cub", "b5e.cub",
            "b6h.cub", "b6e.cub",
            "b7h.cub", "b7e.cub",
            "b8h.cub", "b8e.cub",
            "b9h.cub", "b9e.cub",
            "b10h.cub", "b10e.cub",
            "b11h.cub", "b11e.cub",
            "b12h.cub", "b12e.cub"
        ];

        const selector = document.getElementById('orbital-selector');
        ORBITAL_FILES.forEach(file => {
            const opt = document.createElement('option');
            opt.value = file;
            opt.textContent = file.replace('.cub', '').toUpperCase();
            selector.appendChild(opt);
        });

        const statusEl = document.getElementById('status');
        statusEl.textContent = "Autonomous core active. Executing element scan...";

        // --- 2. ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ХОЛСТА ---
        let scene, camera, renderer, controls;
        let posMaterial, negMaterial, marchingCubesController;
        let currentVolumetricData = null;
        let activeResolution = 40;
        let atomMeshGroup = new THREE.Group();

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x05050a);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(30, 30, 50);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);
                        controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambientLight = new THREE.AmbientLight(0x555555);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight1.position.set(1, 1, 1).normalize();
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0x7788ff, 0.4);
            dirLight2.position.set(-1, -1, -1).normalize();
            scene.add(dirLight2);

            posMaterial = new THREE.MeshPhongMaterial({ color: 0xff4444, transparent: true, opacity: 0.65, side: THREE.DoubleSide, shininess: 40 });
            negMaterial = new THREE.MeshPhongMaterial({ color: 0x4444ff, transparent: true, opacity: 0.65, side: THREE.DoubleSide, shininess: 40 });

            // Add our molecular geometry container group directly to the canvas view
            scene.add(atomMeshGroup);

            selector.addEventListener('change', (e) => fetchAndParseCube(e.target.value));
            
            document.getElementById('isovalue-slider').addEventListener('input', (e) => {
                document.getElementById('slider-val').textContent = parseFloat(e.target.value).toFixed(3);
                updateIsosurface();
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
            fetchAndParseCube(ORBITAL_FILES); 
        }

        // --- 3. SPECTROSCOPIC INTELLIGENT CUBE STREAM PARSER ---
        async function fetchAndParseCube(fileName) {
            statusEl.textContent = `Loading local ${fileName.toUpperCase()}...`;
            statusEl.style.color = '#00ffcc';
            
            const targetUrl = `data/${fileName}`;
            
            try {
                const response = await fetch(targetUrl);
                if (!response.ok) throw new Error("Local dataset stream read failure.");
                const text = await response.text();
                
                statusEl.textContent = "Scanning atomic element configurations...";
                
                // Convert the file text layout into a flat numerical array stream cleanly
                const tokens = text.trim().split(/\s+/);
                
                // Clear out old molecular remnants from past degenerate runs completely
                while(atomMeshGroup.children.length > 0){
                    atomMeshGroup.remove(atomMeshGroup.children);
                }

                // Explicit grid resolution indicators defaults
                let countX = 40, countY = 40, countZ = 40;
                let densityValuesStartPtr = 0;
                let atomsFoundCounter = 0;

                // --- 4. STREAMING ELEMENT INTERCEPTOR LOOP ---
                // First pass: locate the voxel resolutions hidden inside rows 3, 4, 5
                let meshGridsLocated = 0;
                for (let i = 2; i < tokens.length; i++) {
                    let tokenVal = tokens[i];
                    if (tokenVal.indexOf('.') !== -1) continue; // Skip comments and decimal points
                    
                    let intVal = parseInt(tokenVal);
                    if (isNaN(intVal) || intVal === 0) continue;

                    // Skip the atom count identifier row (-7)
                    if (Math.abs(intVal) === 7 && meshGridsLocated === 0) continue;

                    meshGridsLocated++;
                    if (meshGridsLocated === 1) countX = Math.abs(intVal);
                    if (meshGridsLocated === 2) countY = Math.abs(intVal);
                    if (meshGridsLocated === 3) {
                        countZ = Math.abs(intVal);
                        // The actual molecular structure blocks start 4 elements further down the array
                        densityValuesStartPtr = i + 4; 
                        break;
                    }
                }

                // Second pass: Scan the stream specifically for elements numbers (27 and 17)
                let scanPtr = densityValuesStartPtr;
                while (scanPtr < tokens.length && atomsFoundCounter < 7) {
                    let currentInt = parseInt(tokens[scanPtr]);
                    
                    if (currentInt === 27 || currentInt === 17) {
                        atomsFoundCounter++;
                        
                        // Step over the element tracker and the atomic valence charge parameter token
                        scanPtr += 2; 
                        
                        // Extract structural coordinates positions cleanly and apply zoom scaling
                        let posX = parseFloat(tokens[scanPtr++]) * 6.0;
                        let posY = parseFloat(tokens[scanPtr++]) * 6.0;
                        let posZ = parseFloat(tokens[scanPtr++]) * 6.0;

                        let elementColor = 0xccd7e6; 
                        let atomRadius = 0.8;

                        if (currentInt === 27) {
                            elementColor = 0x8a2be2; // Royal Purple layout for center Cobalt core
                            atomRadius = 1.4;
                        } else if (currentInt === 17) {
                            elementColor = 0x32cd32; // Vibrant Neon Green for your 6 Chlorine fields
                            atomRadius = 1.0;
                        }

                        let geom = new THREE.SphereGeometry(atomRadius, 32, 32);
                        let mat = new THREE.MeshPhongMaterial({ color: elementColor, shininess: 80, specular: 0x444444 });
                        let mesh = new THREE.Mesh(geom, mat);
                        
                        mesh.position.set(posX, posY, posZ);
                        atomMeshGroup.add(mesh);
                        
                        continue;
                    }
                    scanPtr++;
                }
                                // Step over the trailing Gaussian matrix records indicator row (1 59)
                while (scanPtr < tokens.length) {
                    let checkVal = tokens[scanPtr];
                    if (checkVal === "1" && tokens[scanPtr + 1] === "59") {
                        scanPtr += 2;
                        break;
                    }
                    // Safe guard backup fallback break point when reaching small decimal density coordinates
                    if (checkVal.indexOf('.') !== -1 && parseFloat(checkVal) < 1.0 && parseFloat(checkVal) > -1.0) {
                        break;
                    }
                    scanPtr++;
                }

                // --- 5. DENSITY DATA FIELD EXTRACTOR LOOP ---
                let volumetricValuesGrid = [];
                for (let k = scanPtr; k < tokens.length; k++) {
                    let densityValue = parseFloat(tokens[k]);
                    if (!isNaN(densityValue)) {
                        volumetricValuesGrid.push(densityValue);
                    }
                }
                
                currentVolumetricData = {
                    nx: countX, ny: countY, nz: countZ,
                    data: volumetricValuesGrid
                };
                
                statusEl.textContent = "Recalculating voxel grids...";
                updateIsosurface();
                statusEl.textContent = "Orbital Render Complete!";
                statusEl.style.color = '#00ff66';
                
            } catch (err) {
                statusEl.textContent = `Error processing cube matrix.`;
                statusEl.style.color = '#ff4444';
                console.error(err);
            }
        }

        // --- 6. EXTRA-RESILIENT VOLUMETRIC CALCULATOR (MARCHING CUBES) ---
        function updateIsosurface() {
            if (!currentVolumetricData || !scene) return;
            
            if (marchingCubesController) scene.remove(marchingCubesController);
            
            const isovalue = parseFloat(document.getElementById('isovalue-slider').value);
            
            // Dynamically scale mapping resolution constraints based on actual file counts arrays
            let gridMaxRes = Math.max(currentVolumetricData.nx, currentVolumetricData.ny, currentVolumetricData.nz);
            let targetRes = Math.min(gridMaxRes, 40); // Lock visual performance bounds safely
            
            marchingCubesController = new THREE.MarchingCubes(targetRes, posMaterial, true, true, 100000);
            marchingCubesController.position.set(0, 0, 0);
            marchingCubesController.scale.set(45, 45, 45); 
            
            marchingCubesController.init(targetRes);
            
            const data = currentVolumetricData.data;
            const nx = currentVolumetricData.nx;
            const ny = currentVolumetricData.ny;
            const nz = currentVolumetricData.nz;
            
            // Loop through coordinate matrices discarding shell grids to sweep away edge slicing block artifacts
            for (let x = 1; x < targetRes - 1; x++) {
                for (let y = 1; y < targetRes - 1; y++) {
                    for (let z = 1; z < targetRes - 1; z++) {
                        let dataX = Math.floor((x / targetRes) * nx);
                        let dataY = Math.floor((y / targetRes) * ny);
                        let dataZ = Math.floor((z / targetRes) * nz);
                        let index = dataX * (ny * nz) + dataY * nz + dataZ;
                        
                        let val = data[index] || 0;
                        marchingCubesController.setValue(x, y, z, val);
                    }
                }
            }
            
            marchingCubesController.isolation = isovalue;
            scene.add(marchingCubesController);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls && renderer && camera && scene) {
                controls.update();
                renderer.render(scene, camera);
            }
        }
        
        init3D();
    </script>
</body>
</html>
